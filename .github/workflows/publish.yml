name: Publish to PyPI

# Builds the sdist + wheel and publishes to PyPI when a v* tag is pushed.
# Uses PyPI Trusted Publishing (OIDC) — no API token stored in secrets.
#
# One-time PyPI setup:
#   1. Sign in to https://pypi.org and open Account settings → Publishing.
#   2. Click "Add a new pending publisher" with:
#         PyPI Project Name : rublexpayments
#         Owner             : rublex-company
#         Repository name   : python-payments
#         Workflow name     : publish.yml
#         Environment name  : pypi
#   3. The first successful run of this workflow will create the project on PyPI.
#
# After that, every `git tag vX.Y.Z && git push origin vX.Y.Z` publishes a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-and-publish:
    name: Build & publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rublexpayments
    permissions:
      id-token: write  # required for trusted publishing
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build backend
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify version matches tag
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VER="$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          echo "tag=$TAG  package=$PKG_VER"
          if [ "$TAG" != "$PKG_VER" ]; then
            echo "::error::Tag $TAG does not match pyproject version $PKG_VER"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
